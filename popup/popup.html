<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiteVolume</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <span class="brand-name">SiteVolume</span>
      </div>
      <button id="btnOptions" class="icon-button" title="Manage All Sites" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Normal Web Site View -->
    <main id="mainView" class="main-content">
      <!-- Site Domain Card -->
      <div class="site-card">
        <div class="site-info">
          <img id="siteFavicon" class="site-favicon" src="" alt="" style="display: none;">
          <div id="siteFallbackIcon" class="fallback-icon">🌐</div>
          <div class="site-meta">
            <span id="siteDomain" class="site-domain">chess.com</span>
            <span id="siteStatusBadge" class="status-badge">Default</span>
          </div>
        </div>
      </div>

      <!-- Big Volume Readout -->
      <div class="readout-section">
        <div class="readout-row">
          <span id="volumePercentage" class="volume-number">100%</span>
          <span id="volumeLabel" class="volume-badge">Default</span>
        </div>
      </div>

      <!-- Slider Container -->
      <div class="slider-wrapper">
        <div class="slider-track-container">
          <input 
            type="range" 
            id="volumeSlider" 
            min="0" 
            max="100" 
            value="100" 
            step="1"
            aria-label="Volume Slider"
          >
        </div>
      </div>

      <!-- Quick Preset Buttons -->
      <div class="preset-buttons">
        <button class="preset-btn" id="btnMute" title="Mute/Unmute">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
          </svg>
          <span id="muteBtnText">Mute</span>
        </button>
        <button class="preset-btn" data-volume="25">25%</button>
        <button class="preset-btn" data-volume="50">50%</button>
        <button class="preset-btn" data-volume="75">75%</button>
        <button class="preset-btn" data-volume="100">100%</button>
      </div>

      <!-- Mode & Options -->
      <div class="options-box">
        <label class="switch-row">
          <div class="switch-label">
            <span class="label-title">Remember for this site</span>
            <span class="label-sub">Saves volume permanently for this domain</span>
          </div>
          <input type="checkbox" id="chkRemember" checked>
          <span class="toggle-slider"></span>
        </label>

        <label class="switch-row" style="margin-top: 8px;">
          <div class="switch-label">
            <span class="label-title">Audio Boost Mode</span>
            <span class="label-sub">Expand range up to 200%</span>
          </div>
          <input type="checkbox" id="chkBoost">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- Footer Action -->
      <div class="footer-actions">
        <button id="btnReset" class="secondary-btn">Reset Site to Default</button>
      </div>
    </main>

    <!-- Restricted Tab View (chrome:// or edge://) -->
    <div id="restrictedView" class="restricted-view" style="display: none;">
      <div class="restricted-icon">🔒</div>
      <h3>System Page</h3>
      <p>Browser volume manipulation cannot run on internal system pages. Open any website like <strong>chess.com</strong> or <strong>youtube.com</strong> to control volume.</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
